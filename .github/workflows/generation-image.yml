name: Build generation container

on:
  workflow_dispatch:
  push:
    branches:
      - feature/home-checkout
    paths:
      - .github/workflows/generation-image.yml
      - .dockerignore
      - containers/generation/**
      - data_synthesis/migration/environment/pip_freeze_gemma4.txt

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/haolingpu/cmu-research-smt-generation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish pinned image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/generation/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:git-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:feature-home-checkout
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable pull reference
        run: |
          echo "### Generation container" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "docker://${IMAGE_NAME}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
